version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors need a planned migration (Next 16, Tailwind 4, ESLint 10, etc.)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 2.8.6 wrongly depends on the npm CLI; stay on 2.8.5 until a fixed release
      - dependency-name: react-multi-carousel

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
